name: Manual SciFact retrieval benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      # Same release commits verified in the accompanying HarnessLab workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install local retrieval dependencies
        run: |
          python -m pip install uv==0.10.7
          uv sync --locked --extra dense
      - name: Download and verify dataset
        run: uv run --locked --extra dense python -m evidenceforge download
      - name: Download pinned model artifacts
        run: uv run --locked --extra dense python -m evidenceforge download-model
      - name: Run frozen retrieval protocol
        env:
          HF_HUB_OFFLINE: '1'
        run: uv run --locked --extra dense python -m evidenceforge benchmark --output runs/ci
      - name: Recompute metrics from saved rankings
        run: uv run --locked --extra dense python -m evidenceforge verify runs/ci/results.json
      - name: Upload results and configuration only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidenceforge-scifact-${{ github.run_id }}
          path: |
            runs/ci/frozen-config.json
            runs/ci/results.json
            runs/ci/report.html
          if-no-files-found: warn
          retention-days: 14
