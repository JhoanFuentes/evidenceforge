name: Contract checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    env:
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      # Same release commits verified in the accompanying HarnessLab workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and lint tool
        run: python -m pip install ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Run core contracts with mocked provider calls
        run: python -m unittest discover -s tests -v
      - name: Check packaged CLI entry point
        run: python -m evidenceforge --help
      - name: Audit the included measured experiment
        run: python scripts/verify_example.py
      - name: Run offline demo
        run: python -m evidenceforge demo --output runs/demo

  dense-contracts:
    name: Dense contracts / ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install optional dense dependencies
        run: python -m pip install ".[dense]"
      - name: Run vector and cache contracts without model inference
        run: python -m unittest discover -s tests -v
