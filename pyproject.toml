[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evidenceforge"
version = "0.1.0"
description = "Auditable retrieval experiments and citation integrity for evidence-grounded AI"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Jhoan Fuentes"}]
dependencies = []
keywords = ["retrieval", "rag", "evaluation", "applied-ai", "embeddings"]

[project.urls]
Repository = "https://github.com/JhoanFuentes/evidenceforge"
Documentation = "https://github.com/JhoanFuentes/evidenceforge#readme"
Report = "https://jhoanfuentes.github.io/evidenceforge/"
Issues = "https://github.com/JhoanFuentes/evidenceforge/issues"

[project.optional-dependencies]
dense = ["fastembed==0.9.1", "numpy==2.5.5"]
dev = ["ruff==0.17.5"]
figures = ["matplotlib==3.11.2"]

[project.scripts]
evidenceforge = "evidenceforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
